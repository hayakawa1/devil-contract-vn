<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シナリオエディタ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    header {
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }
    header h1 { font-size: 1.2rem; margin-right: auto; }
    button {
      background: #0f3460;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #1a4a7a; }
    button.primary { background: #e94560; }
    button.primary:hover { background: #ff6b6b; }

    /* メインエリア */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 左: コマンドリスト */
    #command-list {
      width: 400px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      overflow-y: auto;
      padding: 10px;
    }

    .command-item {
      background: #1a1a2e;
      margin-bottom: 4px;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      border-left: 3px solid transparent;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .command-item:hover { background: #252545; }
    .command-item.selected {
      background: #0f3460;
      border-left-color: #e94560;
    }
    .command-item .type {
      background: #0f3460;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      min-width: 50px;
      text-align: center;
    }
    .command-item .type.bg { background: #2e7d32; }
    .command-item .type.bgm { background: #1565c0; }
    .command-item .type.char { background: #6a1b9a; }
    .command-item .type.text { background: #455a64; }
    .command-item .type.choice { background: #e65100; }
    .command-item .content {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .command-item .actions {
      display: none;
      gap: 4px;
    }
    .command-item:hover .actions { display: flex; }
    .command-item .actions button {
      padding: 2px 6px;
      font-size: 0.7rem;
    }

    /* 中央: プレビュー */
    #preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    #preview {
      width: 640px;
      height: 360px;
      background: #222;
      position: relative;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #444;
    }

    #preview-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-color: #333;
    }

    #preview-char {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 280px;
      width: 200px;
      background-size: contain;
      background-position: bottom center;
      background-repeat: no-repeat;
    }

    #preview-text-box {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.8);
      padding: 15px 20px;
      min-height: 100px;
    }

    #preview-speaker {
      color: #e94560;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    #preview-text {
      font-size: 1rem;
      line-height: 1.6;
    }

    #preview-info {
      margin-top: 15px;
      padding: 10px;
      background: #16213e;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    #preview-info div { margin: 5px 0; }
    #preview-info span { color: #888; margin-right: 10px; }

    /* 右: プロパティ編集 */
    #property-panel {
      width: 300px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      padding: 15px;
      overflow-y: auto;
    }

    #property-panel h3 {
      font-size: 0.9rem;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #0f3460;
    }

    .prop-group {
      margin-bottom: 15px;
    }
    .prop-group label {
      display: block;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 5px;
    }
    .prop-group input, .prop-group select, .prop-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #1a1a2e;
      color: #fff;
      font-size: 0.9rem;
    }
    .prop-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    /* ツールバー */
    #add-toolbar {
      padding: 10px;
      background: #0f3460;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    #add-toolbar button {
      font-size: 0.8rem;
      padding: 5px 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>シナリオエディタ</h1>
    <input type="file" id="file-input" accept=".txt,.ks" style="display:none">
    <button onclick="showFileList()">📂 シナリオ一覧</button>
    <button onclick="document.getElementById('file-input').click()">開く</button>
    <button onclick="saveFile()">保存 (.ks)</button>
    <button onclick="exportTxt()">保存 (.txt)</button>
    <button class="primary" onclick="playPreview()">▶ 再生</button>
    <button onclick="stopPreview()">■ 停止</button>
  </header>

  <!-- ファイル一覧モーダル -->
  <div id="file-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000; display:none; justify-content:center; align-items:center;">
    <div style="background:#16213e; border-radius:8px; padding:20px; width:500px; max-height:80vh; overflow:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0;">シナリオファイル一覧</h3>
        <button onclick="closeFileModal()" style="background:none; border:none; color:#888; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <div id="file-list" style="max-height:60vh; overflow-y:auto;"></div>
    </div>
  </div>

  <main>
    <div id="command-list">
      <div id="add-toolbar">
        <button onclick="addCommand('bg')">+背景</button>
        <button onclick="addCommand('bgm')">+BGM</button>
        <button onclick="addCommand('char')">+キャラ</button>
        <button onclick="addCommand('text')">+セリフ</button>
        <button onclick="addCommand('narration')">+ナレ</button>
        <button onclick="addCommand('choice')">+選択肢</button>
      </div>
      <div id="commands"></div>
    </div>

    <div id="preview-area">
      <div id="preview">
        <div id="preview-bg"></div>
        <div id="preview-char"></div>
        <div id="preview-text-box">
          <div id="preview-speaker"></div>
          <div id="preview-text"></div>
        </div>
      </div>
      <div id="preview-info">
        <div><span>背景:</span> <span id="info-bg">-</span></div>
        <div><span>BGM:</span> <span id="info-bgm">-</span></div>
        <div><span>キャラ:</span> <span id="info-char">-</span></div>
      </div>
    </div>

    <div id="property-panel">
      <h3>プロパティ</h3>
      <div id="properties">
        <p style="color:#666">コマンドを選択してください</p>
      </div>
    </div>
  </main>

  <audio id="bgm-audio" loop></audio>

  <!-- 右クリックメニュー -->
  <div id="context-menu" style="display:none; position:fixed; background:#1a1a2e; border:1px solid #0f3460; border-radius:4px; padding:5px 0; z-index:1000; min-width:150px;">
    <div class="ctx-item" onclick="ctxAddBefore('bg')">↑ 背景を上に追加</div>
    <div class="ctx-item" onclick="ctxAddBefore('bgm')">↑ BGMを上に追加</div>
    <div class="ctx-item" onclick="ctxAddBefore('char')">↑ キャラを上に追加</div>
    <div class="ctx-item" onclick="ctxAddBefore('text')">↑ セリフを上に追加</div>
    <div class="ctx-separator"></div>
    <div class="ctx-item" onclick="ctxAddAfter('bg')">↓ 背景を下に追加</div>
    <div class="ctx-item" onclick="ctxAddAfter('bgm')">↓ BGMを下に追加</div>
    <div class="ctx-item" onclick="ctxAddAfter('char')">↓ キャラを下に追加</div>
    <div class="ctx-item" onclick="ctxAddAfter('text')">↓ セリフを下に追加</div>
    <div class="ctx-separator"></div>
    <div class="ctx-item" onclick="ctxDuplicate()">複製</div>
    <div class="ctx-item ctx-delete" onclick="ctxDelete()">削除</div>
  </div>

  <style>
    .ctx-item { padding: 8px 15px; cursor: pointer; font-size: 0.85rem; }
    .ctx-item:hover { background: #0f3460; }
    .ctx-delete { color: #e94560; }
    .ctx-separator { height: 1px; background: #0f3460; margin: 5px 0; }
    .file-item { padding: 10px 15px; background: #1a1a2e; margin: 4px 0; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    .file-item:hover { background: #0f3460; }
  </style>

  <script src="editor.js"></script>
</body>
</html>
