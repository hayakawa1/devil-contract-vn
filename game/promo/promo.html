<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>悪魔との契約 promo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --w: 1920px; --h: 1080px; }
  html, body { margin: 0; padding: 0; background: #0a0204; }
  .card {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    font-family: "Yu Mincho", "YuMincho", "Noto Serif JP", serif; color: #f7ead0;
    background: #0a0204 url("keyvisual.png") center top / cover no-repeat;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to top, rgba(8,1,3,.96) 0%, rgba(8,1,3,.82) 17%, rgba(8,1,3,0) 36%),
      radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
  }
  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;
    padding: 0 72px 54px;
  }
  .title { display: flex; flex-direction: column; gap: 6px; }
  .title img { width: 820px; display: block; filter: drop-shadow(0 6px 16px rgba(0,0,0,.8)); margin: 0 0 -30px -60px; }
  .tagline { font-size: 34px; letter-spacing: .12em; margin: 0; text-shadow: 0 2px 10px #000; }
  .sub { font-family: "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif; font-weight: 700; font-size: 19px;
         letter-spacing: .16em; color: #e7b766; margin: 4px 0 0; text-transform: uppercase; white-space: nowrap; }
  .link {
    display: flex; align-items: center; gap: 26px;
    background: rgba(20,3,6,.78); border: 2px solid #c79a4a; border-radius: 18px;
    padding: 20px 26px; box-shadow: 0 0 40px rgba(180,20,30,.45);
  }
  .link .txt { display: flex; flex-direction: column; gap: 8px; font-family: "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif; }
  .link .label { font-size: 22px; font-weight: 700; letter-spacing: .14em; color: #e7b766; }
  .link .url { font-size: 44px; font-weight: 800; color: #fff; letter-spacing: .01em; }
  .link .note { font-size: 20px; color: #f0d9b5; }
  #qr { background: #fff; padding: 10px; border-radius: 8px; line-height: 0; }
  #qr img { display: block; }

  /* square variant */
  .card.square .bottom { flex-direction: column; align-items: center; padding: 0 48px 48px; gap: 26px; text-align: center; }
  .card.square { background-size: 118% auto; background-position: center 0; }
  .card.square .title { align-items: center; }
  .card.square .title img { width: 760px; margin: 0 0 -30px 0; }
  .card.square .sub { white-space: normal; }
  .card.square::after {
    background:
      linear-gradient(to top, #080103 0%, #080103 34%, rgba(8,1,3,.6) 44%, rgba(8,1,3,0) 56%),
      radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
  }
  .card.square .tagline { font-size: 30px; }
  .card.en .tagline { font-family: "Cinzel", "Trajan Pro", "Georgia", serif; letter-spacing: .06em; font-style: italic; }
  .card.square .link .url { font-size: 40px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="bottom">
    <div class="title">
      <img src="../public/assets/ui/title_logo.svg" alt="悪魔との契約" />
      <p class="tagline" id="tagline">願いは叶う。代償は、彼女たちの心。</p>
      <p class="sub" id="sub">Muscle Transformation Visual Novel · 7 Heroines · 22 Endings</p>
    </div>
    <div class="link">
      <div id="qr"></div>
      <div class="txt">
        <span class="label">SUPPORT &amp; PLAY ON PATREON</span>
        <span class="url">patreon.com/BWBA</span>
        <span class="note" id="note">最新版・先行公開はこちら</span>
      </div>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('lang') === 'en') {
    document.documentElement.lang = 'en';
    document.getElementById('card').classList.add('en');
    document.getElementById('tagline').textContent = 'Your wish comes true. The price is their hearts.';
    document.getElementById('note').textContent = 'Latest builds & early access';
    document.getElementById('sub').textContent = 'Muscle Transformation Visual Novel · 7 Heroines · 22 Endings · English / 日本語';
  }
  if (params.get('format') === 'square') {
    document.documentElement.style.setProperty('--w', '1080px');
    document.documentElement.style.setProperty('--h', '1080px');
    document.getElementById('card').classList.add('square');
  }
  try {
    const qr = qrcode(0, 'M');
    qr.addData('https://www.patreon.com/BWBA');
    qr.make();
    document.getElementById('qr').innerHTML = qr.createImgTag(4, 0);
  } catch (e) {
    document.getElementById('qr').remove();
  }
</script>
</body>
</html>
